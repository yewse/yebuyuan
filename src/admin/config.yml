backend:
  name: github
  repo: yewse/yebuyuan
  branch: main
  base_url: https://0liver.pages.dev
  auth_endpoint: /api/auth

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

locale: zh_Hans

collections:
  - name: "posts"
    label: "技术笔记"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    editor:
      preview: true
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
        hint: "文章标题"
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "摘要"
        name: "summary"
        widget: "text"
        required: true
        hint: "显示在文章列表的简短描述"
      - label: "封面图"
        name: "cover"
        widget: "image"
        required: false
        hint: "选择封面图片（可选）"
      - label: "装饰色"
        name: "accent"
        widget: "select"
        required: false
        default: "copper"
        options:
          - label: "铜箔橙"
            value: "copper"
          - label: "电解液青"
            value: "electrolyte"
        hint: "文章强调色"
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
        hint: "添加相关标签"
      - label: "示例笔记"
        name: "sample"
        widget: "boolean"
        default: false
        required: false
      - label: "布局"
        name: "layout"
        widget: "hidden"
        default: "post"
      - label: "内容"
        name: "body"
        widget: "markdown"
        hint: "使用Markdown编写文章。可手动插入装饰块（见文档）"

  - name: "homepage"
    label: "首页"
    files:
      - label: "首页内容"
        name: "home"
        file: "src/content/home.yml"
        fields:
          - label: "名称"
            name: "name"
            widget: "string"
            default: "Oliver"
            hint: "显示在首页的名称"
          - label: "职位"
            name: "title"
            widget: "string"
            default: "锂电高级工艺工程师"
          - label: "简介"
            name: "tagline"
            widget: "text"
            hint: "首页Hero区的简短介绍"
          - label: "显示最新笔记"
            name: "show_latest_posts"
            widget: "boolean"
            default: true
          - label: "最新笔记数量"
            name: "latest_posts_count"
            widget: "number"
            default: 3
            value_type: "int"
            min: 1
            max: 10

  - name: "about"
    label: "个人介绍"
    files:
      - label: "关于页面"
        name: "about"
        file: "src/content/about.md"
        fields:
          - label: "页面标题"
            name: "title"
            widget: "string"
            default: "关于我"
          - label: "头像图片"
            name: "portrait"
            widget: "image"
            required: false
            hint: "可选的头像照片"
          - label: "内容"
            name: "body"
            widget: "markdown"
            hint: "使用Markdown编写关于页内容。作者署名为Oliver，不要使用真实姓名。"

  - name: "gallery"
    label: "画廊"
    folder: "src/gallery"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    fields:
      - label: "图片"
        name: "image"
        widget: "image"
      - label: "标题"
        name: "title"
        widget: "string"
      - label: "描述"
        name: "caption"
        widget: "text"
        required: false
      - label: "拍摄日期"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
      - label: "排序"
        name: "order"
        widget: "number"
        default: 0
        value_type: "int"
        hint: "数字越小越靠前"
